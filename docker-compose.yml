services:
  postgres:
    image: postgres:16-alpine
    container_name: incidents-db
    environment:
      POSTGRES_DB: incidents
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d incidents"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
